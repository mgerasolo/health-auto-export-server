# Health Auto Export — Apple Health "data lake" (https://github.com/HealthyApps/health-auto-export-server)
# Fork: mgerasolo/health-auto-export-server. main = pure upstream mirror; THIS branch (nlf-deploy) adds only
#       our deploy files. Auto-sync robot (.github/workflows/upstream-sync.yml) merges upstream/main -> nlf-deploy daily.
# Deploy: Fury (10.0.0.20) via Portainer → Git stack `health-auto-export`, branch nlf-deploy, compose path compose.fury.yml
# Tracking: GH mgerasolo/nlf-infrastructure #834
#
# SECRETS: injected as Portainer stack env vars (NOT an env_file) — a Synology Portainer git-stack runs its compose
#   parser INSIDE the Portainer container, which cannot see /volume1/foundry_devlab. Canonical secret record lives at
#   /volume1/foundry_devlab/secrets/env/health-auto-export.env (0600); on rotation, update that file AND re-push env to
#   the Portainer stack. Container bind-mounts to /volume1 are fine (resolved by the host docker daemon).
#
# Public ingest: health.nextlevelfoundry.com -> hae-server :2053 via Cloudflare Tunnel (api-key = WRITE_TOKEN).
# Grafana: INTERNAL-ONLY (no public route). Mongo: LAN :2052 for habitarcade-poc consumer.
# Synology: Grafana NAMED volume (UID-472); json-file logging+tag for Coulson Promtail.

services:
  hae-mongo:
    image: mongo:latest
    container_name: hae-mongo
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    # WiredTiger cache defaults to 50% of host RAM (15.5GB on Fury) — OOM crash-looped WT recovery
    # after the 2026-08-07 unclean reboot (nlf-infrastructure #1010). 2GB is ample for this dataset;
    # mem_limit is the kernel-level backstop (mongod also derives cache from the cgroup limit).
    command: ["--wiredTigerCacheSizeGB", "2"]
    mem_limit: 4g
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
      MONGO_INITDB_DATABASE: ${MONGO_DB}
    volumes:
      - /volume1/docker/health-auto-export/mongo:/data/db
    ports:
      - "2052:27017"
    networks: [hae_network]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    logging: { driver: json-file, options: { tag: "{{.Name}}" } }

  hae-server:
    build: { context: ./server, dockerfile: Dockerfile }
    container_name: hae-server
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    environment:
      NODE_ENV: production
      MONGO_HOST: hae-mongo
      MONGO_PORT: "27017"
      MONGO_DB: ${MONGO_DB}
      MONGO_USERNAME: ${MONGO_USERNAME}
      MONGO_PASSWORD: ${MONGO_PASSWORD}
      READ_TOKEN: ${READ_TOKEN}
      WRITE_TOKEN: ${WRITE_TOKEN}
    ports:
      - "2053:3001"
    depends_on:
      hae-mongo: { condition: service_healthy }
    networks: [hae_network]
    logging: { driver: json-file, options: { tag: "{{.Name}}" } }

  hae-grafana:
    image: grafana/grafana-oss:latest
    container_name: hae-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD}
      GF_INSTALL_PLUGINS: yesoreyeram-infinity-datasource
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "2051:3000"
    depends_on: [hae-mongo]
    networks: [hae_network]
    volumes:
      - hae-grafana-data:/var/lib/grafana
    logging: { driver: json-file, options: { tag: "{{.Name}}" } }

networks:
  hae_network: { driver: bridge }
volumes:
  hae-grafana-data:
